services:
  app:
    image: ghcr.io/tornotron/echno-web:staging-latest
    container_name: echno-web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - KEYCLOAK_WELL_KNOWN=${KEYCLOAK_WELL_KNOWN}
      - KEYCLOAK_ID=${KEYCLOAK_ID}
      - KEYCLOAK_SECRET=${KEYCLOAK_SECRET}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    extra_hosts:
      - 'auth.echno.xyz:host-gateway'
    networks:
      - monitoring
    depends_on:
      - keycloak
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
