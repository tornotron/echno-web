name: Pull request

# Gate for changes entering `development`.

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile

      # A real gate. The 93 errors that predated this pipeline are cleared, so
      # a failing lint now fails the check rather than being reported and
      # scrolled past. Fix what it reports; do not restore continue-on-error.
      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

  # Generates a throwaway module feature from scripts/scaffold/templates and
  # checks it the way a real one would be checked, so a template that drifts
  # from the app (a moved primitive, a changed ModuleGuard, a new boundaries
  # rule, a changed nav registry shape) fails the PR that broke it.
  # `ci-probe` is never committed. Its core subpath is never published
  # either, so the typecheck resolves it to the stand-ins that --core-stub
  # renders (tsconfig.scaffold-check.json); the bundler cannot use those,
  # which is why this job does not run `next build`.
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Scaffold the probe feature
        run: bun run scaffold:feature ci-probe "CI Probe" --core-stub

      - name: Typecheck with the probe in place
        run: bunx tsc --noEmit -p tsconfig.scaffold-check.json

      - name: Lint with the probe in place
        run: bun run lint

      - name: Test the generated surfaces and the generator
        run: bun test features/ci-probe scripts/scaffold-feature.test.ts

      - name: Discard the probe
        run: |
          git clean -fdq features/ci-probe app/users/dashboard/ci-probe nav/metadata/ci-probe.meta.ts scripts/scaffold/.stub
          git checkout -- nav
          test -z "$(git status --porcelain)"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # This repository has a live NextAuth secret in its history. It is
      # already rotated, but the scan stops the next one.
      # The gitleaks GitHub Action requires a paid licence for organisations.
      # The scanner itself is MIT, so it is invoked directly.
      #
      # Only the commits this pull request adds are scanned. Gating on full
      # history would fail permanently on pre-existing matches that are example
      # data, and a check that is always red gets ignored.
      - name: Scan for committed secrets
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
