name: Build, Push, and Deploy to Staging (For the time being `profile-refactor` branch)

on:
  push:
    branches:
      - profile-refactor

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: echno-web
  SERVICE_NAME: echno-web-app

jobs:
  # ------------ Job 1: Build and Push Docker Image ------------
  build_and_push:
    name: Build App and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-,suffix=,format=short
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ------------ Job 2: Deploy to Server ------------
  deploy:
    name: Deploy to Staging Server
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory
            cd /opt/echno-backend
            
            # Export environment variables
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            
            # Stop the current container
            docker compose stop ${{ env.SERVICE_NAME }}
            
            # Pull the latest image
            docker compose pull ${{ env.SERVICE_NAME }}
            
            # Recreate and start the container
            docker compose up --force-recreate ${{ env.SERVICE_NAME }} -d
