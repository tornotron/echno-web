name: Enforce PR source branch

on:
  pull_request:
    branches:
      - staging

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "development" ]]; then
            echo "Only PRs from development are allowed into staging"
            exit 1
          fi
