name: Deploy to Kubernetes

# Continuous deployment to the Kubernetes flavors, which run Argo CD (GitOps).
# This builds the web image, pushes it to GHCR under an immutable per-commit tag,
# then writes that tag into tornotron/echno-deployment; the Argo CD running in
# the target cluster reconciles the change and rolls the new image out. GitHub
# never needs to reach the cluster, so the in-cluster (IITM) flavor works the
# same as DOKS.
#
# Two selectable flavors via the dispatch input:
#   self-managed -> k3s at IITM / on-prem  (values-iitm.yaml)
#   doks         -> DigitalOcean Kubernetes (values-doks.yaml)
#
# Dispatch-only, so it never collides with the compose merge-to-staging deploy.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Kubernetes flavor to deploy
        type: choice
        options: [self-managed, doks]
        default: self-managed

concurrency:
  group: deploy-k8s-${{ github.event.inputs.flavor }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/echno-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scopes vars to the flavour being built. NEXT_PUBLIC_STORAGE_ORIGIN differs
    # per environment and is frozen into the image, so one repository-wide value
    # cannot serve compose, k3s and DOKS at once: whichever value it held would
    # be wrong for two of the three. Setting it on the environment lets each one
    # carry its own. The environment is created on first run and has no
    # protection rules, so this adds no gate; leaving it unset is fine, since the
    # step below already resolves the right default for each flavour.
    environment: k8s-${{ github.event.inputs.flavor }}
    steps:
      # The dispatch input is read through the environment (never interpolated
      # into the shell source) and validated before anything downstream uses it.
      - name: Resolve flavor, values file and image tag
        id: f
        env:
          FLAVOR: ${{ github.event.inputs.flavor }}
          STORAGE_ORIGIN_OVERRIDE: ${{ vars.NEXT_PUBLIC_STORAGE_ORIGIN }}
        run: |
          case "$FLAVOR" in
            self-managed) values=values-iitm.yaml; storage=https://storage-k8s.echno.in ;;
            doks)         values=values-doks.yaml; storage=https://echno-object-store.blr1.cdn.digitaloceanspaces.com ;;
            *) echo "unknown flavor: $FLAVOR" >&2; exit 1 ;;
          esac
          # An environment-scoped variable wins where it is set; otherwise the
          # flavour's own object store is used. self-managed matches
          # domain.storage in echno-deployment's values-iitm.yaml, so the build
          # and the running pod agree by construction. doks names the
          # DigitalOcean Spaces CDN host that flavour serves attachments from,
          # which is a different host from the one it presigns writes against.
          # An `if` and not a `&&` one-liner: run steps are bash -e, so a test
          # that is simply false would fail the whole step.
          if [ -n "$STORAGE_ORIGIN_OVERRIDE" ]; then
            storage="$STORAGE_ORIGIN_OVERRIDE"
          fi
          {
            echo "values=$values"
            echo "tag=staging-${FLAVOR}-${GITHUB_SHA}"
            echo "flavor=$FLAVOR"
            echo "storage_origin=$storage"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # This job builds `context: .`, so keep the workflow token out of the
          # checked-out git config and away from the build context.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable per-commit tag)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.f.outputs.tag }}
          build-args: |
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=/api/v1
            # Frozen into the build by next/image's remotePatterns, so it has
            # to be right at build time and cannot be corrected by restarting the
            # container. Resolved per flavour above; the running pod is given the
            # same value by the chart, which is what the CSP is built from.
            NEXT_PUBLIC_STORAGE_ORIGIN=${{ steps.f.outputs.storage_origin }}
          # Mounted rather than passed as a build arg, so the token to read
          # @tornotron/echno-core from GitHub Packages never lands in a layer.
          secrets: |
            github_token=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fine-grained PAT with contents:write on echno-deployment. persist-credentials
      # is off so the cross-repo write token is not left in the checkout's git config
      # while the pinned yq binary runs; the token is handed only to the final push.
      - name: Check out the deployment repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tornotron/echno-deployment
          ref: main
          token: ${{ secrets.ECHNO_DEPLOYMENT_TOKEN }}
          persist-credentials: false
          path: deployment

      - name: Pin the new web image digest for Argo CD
        working-directory: deployment
        env:
          FLAVOR: ${{ steps.f.outputs.flavor }}
          TAG: ${{ steps.f.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VALUES: ${{ steps.f.outputs.values }}
          DEPLOY_TOKEN: ${{ secrets.ECHNO_DEPLOYMENT_TOKEN }}
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          # The digest is what Argo CD deploys (immutable); the tag rides along for
          # human traceability. build-push-action emits the manifest digest as sha256:...
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "build did not produce a sha256 digest: '$DIGEST'" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          chmod +x /tmp/yq
          /tmp/yq -i ".frontend.tag = strenv(TAG)" "k8s/helm/echno/${VALUES}"
          /tmp/yq -i ".frontend.digest = strenv(DIGEST)" "k8s/helm/echno/${VALUES}"
          git config user.name "echno-ci"
          git config user.email "ci@echno.xyz"
          git add "k8s/helm/echno/${VALUES}"
          if git diff --cached --quiet; then
            echo "image digest unchanged; nothing to deploy"
            exit 0
          fi
          git commit -m "ci(echno-web): ${FLAVOR} -> ${DIGEST}"
          git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/tornotron/echno-deployment.git" HEAD:main
